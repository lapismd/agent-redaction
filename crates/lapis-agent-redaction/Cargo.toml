[package]
name = "lapis-agent-redaction"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/lapismd/agent-redaction"
description = "Native fail-closed agent capture privacy with versioned Kingfisher policies"
readme = "README.md"
publish = ["crates-io"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE.md", "NOTICE.md"]

[dependencies]
serde_json = "1"
thiserror = "2"
kingfisher-core = { version = "=1.0.3", default-features = false }
kingfisher-rules = { version = "=1.2.1", default-features = false }
kingfisher-scanner = { version = "=1.4.0", default-features = false }

[dev-dependencies]
tempfile = "3"
