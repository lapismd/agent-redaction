name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 3
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4,deno@2.9.7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.99.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - run: pnpm audit
      - run: pnpm spec:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:deno
      - run: pnpm test:release
      - run: pnpm release:prepare
      - run: pnpm release:native:prepare
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-release-${{ github.sha }}-ubuntu-24.04
          path: .local/cargo-release
          if-no-files-found: error
          retention-days: 14
  native-macos:
    name: Native macOS ARM64
    uses: ./.github/workflows/qualify-native.yml
    with:
      runner: macos-15
